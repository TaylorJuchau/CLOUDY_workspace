# Starter pcigale.ini for the galaxies course CIGALE project: AGN run.
# This is intentionally a compact teaching grid, not a publication-quality grid.
# If your CIGALE version complains about a parameter name, run:
#   pcigale init
#   edit sed_modules
#   pcigale genconf
# and copy the values below into the generated sections.

data_file = cigale_dustpedia_input.csv
parameters_file =
sed_modules = sfhdelayed, bc03, nebular, dustatt_calzleit, dl2014, fritz2006, redshifting
analysis_method = pdf_analysis
cores = 4

# Use these bands if present in the input table. If CIGALE 2025+ uses revised
# names in your installation, edit these after checking `pcigale-filters list`.
bands = galex.FUV, galex.FUV_err, galex.NUV, galex.NUV_err, sdss.up, sdss.up_err, sdss.gp, sdss.gp_err, sdss.rp, sdss.rp_err, sdss.ip, sdss.ip_err, sdss.zp, sdss.zp_err, 2mass.J, 2mass.J_err, 2mass.H, 2mass.H_err, 2mass.Ks, 2mass.Ks_err, WISE1, WISE1_err, WISE2, WISE2_err, WISE3, WISE3_err, WISE4, WISE4_err
properties =

[sed_modules_params]
  [[sfhdelayed]]
    tau_main = 1000, 3000, 6000, 10000
    age_main = 5000, 10000, 12000
    tau_burst = 50
    age_burst = 10, 100
    f_burst = 0.0, 0.01, 0.05
    sfr_A = 1.0
    normalise = True

  [[bc03]]
    imf = 1
    metallicity = 0.008, 0.02
    separation_age = 10

  [[nebular]]
    logU = -3.0, -2.0
    zgas = 0.02
    ne = 100
    f_esc = 0.0
    f_dust = 0.0
    lines_width = 300.0
    emission = True

  [[dustatt_calzleit]]
    E_BV_lines = 0.05, 0.15, 0.30, 0.50
    E_BV_factor = 0.44
    uv_bump_wavelength = 217.5
    uv_bump_width = 35.0
    uv_bump_amplitude = 0.0
    powerlaw_slope = 0.0
    filters = sdss.up, sdss.gp, sdss.rp

  [[dl2014]]
    qpah = 2.50, 4.58
    umin = 1.0, 5.0, 10.0
    alpha = 2.0
    gamma = 0.02, 0.10

  [[fritz2006]]
    r_ratio = 60.0
    tau = 1.0, 6.0
    beta = -0.5
    gamma = 0.0
    opening_angle = 100.0
    psy = 0.001, 50.100, 89.990
    fracAGN = 0.0, 0.05, 0.10, 0.25, 0.50, 0.75

  [[redshifting]]
    redshift =

[analysis_params]
  variables = stellar.m_star, sfh.sfr, dust.luminosity, dust.mass, attenuation.Av_ISM, agn.fracAGN
  save_best_sed = True
  save_chi2 = False
  lim_flag = noscaling
  mock_flag = False
  blocks = 1
